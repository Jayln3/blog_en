name: Publish English blog migration
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-blog-migration
  cancel-in-progress: false
jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node migration/build.mjs
      - name: Publish migration and wait for Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node migration/publish.mjs
